<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="shortcut icon" href="../img/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/duvidas_frequentes.css">
    <title>Sorriso Prime - Dúvidas Frequentes</title>
</head>
<body>

    <header>
        <div class="h-esq">

            </p>
        </div>

        <span class="material-symbols-outlined" id="btn-menu">
            menu
        </span>

        <nav class="h-cent" id="nav-menu">
            <p>
                <a href="../index.html" target="_self">Ínicio</a>

        </nav>

        <div class="h-dir">

    </header>
    <main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMenu = document.getElementById('btn-menu');
            const navMenu = document.getElementById('nav-menu');

            if (btnMenu && navMenu) {
                btnMenu.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                });
            } else {
                console.error("Elemento #btn-menu ou #nav-menu não encontrado no HTML.");
            }
        });
    </script>
</body>
